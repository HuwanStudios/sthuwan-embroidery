name: Build SE600 PES
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-pes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install encoder
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate TEST-001 PES
        run: PYTHONPATH=. python examples/shamrock_test001.py
      - name: Validate PES by reading it back
        run: |
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path
          from pyembroidery import read_pes
          pth = Path("output/SHAMROCK.PES")
          raw = pth.read_bytes()
          assert raw[:8] == b"#PES0001", raw[:8]
          p = read_pes(str(pth))
          left, top, right, bottom = p.bounds()
          w, h = (right-left)/10, (bottom-top)/10
          assert w <= 100 and h <= 100, (w,h)
          print("signature:", raw[:8])
          print("bytes:", len(raw))
          print("bounds_mm:", round(w,2), round(h,2))
          print("stitches:", len(p.stitches))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SE600-TEST-001-SHAMROCK
          path: output/SHAMROCK.PES
